# Browser netplay matchmaking and relay (src/index.mjs).
# Deploy: npx wrangler deploy  (from this folder, logged in with `npx wrangler login`)
name = "melee-netplay"
main = "src/index.mjs"
compatibility_date = "2026-09-01"

[vars]
# Pages allowed to use this Worker, comma separated ("*" = any). This file
# stays generic; your deployment's origin goes in at deploy time:
#   npx wrangler deploy --var ALLOWED_ORIGINS:https://YOUR.SITE,http://127.0.0.1:5191
ALLOWED_ORIGINS = "http://127.0.0.1:5191,http://localhost:5191"

# Optional Cloudflare Realtime TURN, for players whose networks cannot open a
# direct WebRTC link (the WebSocket relay covers them otherwise):
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
